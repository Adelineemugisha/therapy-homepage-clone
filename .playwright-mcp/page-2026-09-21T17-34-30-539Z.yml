      - generic [ref=f3e18]:
        - img "Jennifer Anderson Profile Presentation" [ref=f3e21]
        - generic [ref=f3e22]:
          - generic [ref=f3e23]:
            - heading "Jennifer Anderson" [level=1] [ref=f3e24]
            - paragraph [ref=f3e25]: "Licensed Marriage & Family Therapist #46111"
          - heading "It’s time for a future unburdened by the past so you can live fully in the present." [level=2] [ref=f3e26]
          - generic [ref=f3e27]:
            - paragraph [ref=f3e28]: I specialize in complex trauma, dissociation, and special needs parenting. Clients often come to me feeling like what they’ve been doing just isn’t working anymore, hitting a wall of burnout and overwhelm. They’ve tried countless strategies to improve their relationships, be better parents, or simply move forward, but nothing seems to bring the change they desperately seek. I’m here to help them find that change.
            - paragraph [ref=f3e29]: Living with complex trauma can lead to feelings of deep-seated anxiety, confusion, and emotional numbness. Many of my clients describe a sense of disconnection from themselves and their surroundings, often struggling to navigate daily life while managing overwhelming emotions. This dissociation can make it difficult to engage fully in their life and relationships, which only amplifies feelings of guilt and inadequacy.
          - generic [ref=f3e30]:
            - button "Specialties +" [ref=f3e32] [cursor=pointer]:
              - generic [ref=f3e33]: Specialties
              - generic [ref=f3e34]: +
            - button "Modalities +" [ref=f3e36] [cursor=pointer]:
              - generic [ref=f3e37]: Modalities
              - generic [ref=f3e38]: +
      - generic [ref=f3e40]:
        - paragraph [ref=f3e41]: Being a parent is difficult, especially when you’re raising a child with unique challenges of their own. As a parent of two special needs kids myself, I understand the challenges and emotions that come with that role. I’ve been in the trenches—the exhaustion, the isolation, and the overwhelming responsibility of advocating for your child. I’m here to help you feel seen and validated so we can move through whatever you’re feeling, together.
        - paragraph [ref=f3e42]: It’s important to acknowledge the depth of these feelings. You are not alone in your experiences, and there is hope for healing and connection. Together, we can explore the complexities of your emotions and uncover pathways to peace and empowerment.
      - generic [ref=f3e43]:
        - heading "One of my first priorities in our work together is helping you feel safe." [level=2] [ref=f3e44]
        - generic [ref=f3e45]:
          - generic [ref=f3e46]:
            - paragraph [ref=f3e47]: If you’re feeling overwhelmed or struggling with intense emotions, we’ll work together to manage those first, creating a foundation of support and stability. I’ll also help you understand how the trauma you’ve been through can affect both your brain and body. This allows you to begin understanding and recognizing all the different parts of yourself—your roles, your anxious parts, and where feelings are coming from. Together, we’ll move through your feelings and uncover the hard experiences you’ve been through at a pace that feels right for you.
            - paragraph [ref=f3e48]: I’m here to listen, validate your stress, and help you feel seen in what you’re going through, whether you’re a parent of special needs, someone who’s experiencing dissociation, or trying to move on from the past. We’ll work on coping tools for the day-to-day challenges, learning when it’s okay to delegate or seek outside help.
          - generic [ref=f3e49]:
            - generic [ref=f3e50]:
              - paragraph [ref=f3e51]: I also believe in the power of effort and commitment within the therapy experience. If you’re willing to show up and do the work—just like I am—you can see profound changes in your life and understand how your past has shaped the way you see and feel about yourself.
              - paragraph [ref=f3e52]: With over 20 years of experience in this field, I’ve had the privilege of working with people from all walks of life. My lived experiences empower me to connect with you in a genuine, personal way. With this kind of support, you can heal, regain confidence, and feel empowered in a way that maybe hasn’t seemed possible before. It’s okay to start where you are and take things one step at a time—you don’t have to do it alone. I will meet you wherever you are, help lift you up, and guide you toward a brighter future ahead.
            - link "Schedule an Appointment" [ref=f3e54] [cursor=pointer]:
              - /url: /contact
