        - generic [ref=e77]:
          - heading "Expertise." [level=4] [ref=e78]
          - paragraph [ref=e79]: We’ve spent years honing our skills and knowledge, but we never stop learning from our clients. Every session allows us the opportunity to help you grow while deepening our understanding of what truly helps people. As we work to help you uncover patterns, you’ll gain practical tools to use in your daily life and feel empowered to make real, lasting changes.
        - generic [ref=e80]:
          - heading "Understanding." [level=4] [ref=e81]
          - paragraph [ref=e82]: Your story is your own, and we honor that. Our team takes the time to listen and really understand what it’s like to walk in your shoes. Whether it’s your relationships, your work, or the way you move through the world, we’re here to listen. Our approach isn’t one-size-fits-all because your experience is unique, and we believe the way you’re supported should be, too.
        - generic [ref=e83]:
          - heading "Transformation." [level=4] [ref=e84]
          - paragraph [ref=e85]: True change doesn’t happen overnight but it does happen with commitment and consistency. We believe in working alongside you to create real, tangible shifts—not just in how you feel but in how you live. With our support, you’ll build a stronger foundation, find your footing, and move forward with more clarity, confidence, and connection to yourself and others.
