        - heading "It seems like nobody else understands what you’re going through." [level=2] [ref=e30]
        - generic [ref=e31]:
          - paragraph [ref=e32]: You could be here as a parent, a spouse, or simply someone trying to navigate the things life has thrown your way.
          - paragraph [ref=e33]: We know how frustrating it can be trying to make sense of your emotions and balance everyone else’s needs along with your own. Our expertise, lived experiences, and empathetic approach help our clients feel safe and understood in their challenges—no matter what they bring to the table.
