          - paragraph [ref=e41]: Our Approach
          - heading "We believe real change starts with understanding yourself, but we know that’s not enough—you need to know how to make that change happen." [level=2] [ref=e42]
        - generic [ref=e43]:
          - img "Walk along beach layout illustration" [ref=e46]
          - generic [ref=e47]:
            - heading "That’s where we come in." [level=4] [ref=e48]
            - paragraph [ref=e49]: We’re here to listen, to honor what you’ve been through, and to help you make sense of your experiences, without judgment or preconceived agendas. We also recognize that this can be a vulnerable experience, especially if you’re used to being someone who has managed it all on your own before. This is a place where you can be free to show up exactly as you are knowing that we’re proud of you and are ready to help you feel grounded, even when life feels chaotic.
            - paragraph [ref=e50]: Our goal is to not only help you understand yourself on a deeper level but to also give you practical skills you can use in your daily life. We expect you to show up, not just physically, but with a willingness to reflect, apply what you’ve learned, and engage in this work of healing. We believe that growth happens through consistency, both in and out of sessions.
            - generic [ref=e51]:
              - generic [ref=e52]:
                - paragraph [ref=e53]: Together, we’ll tackle the specific challenges you’re facing—conflict in your relationships, stress at work, or feeling disconnected from yourself or others.
                - paragraph [ref=e54]: We know that no one else has lived your life as you, so we’ll take the time to understand your experience not just as therapists, but as people who genuinely care. You don’t need to have it all figured out, you just need to be ready to take those first steps. When everything else feels unsteady, we hope to be a place of safety and stability in your life.
